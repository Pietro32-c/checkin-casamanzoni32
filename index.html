<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benvenuto a Casa Manzoni 32</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #34495e; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .ospite-box { background: #f9f9f9; border-left: 4px solid #3498db; padding: 15px; margin-top: 15px; border-radius: 4px; }
        button { background-color: #2ecc71; color: white; border: none; padding: 12px 20px; font-size: 18px; width: 100%; border-radius: 4px; cursor: pointer; margin-top: 25px; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .privacy { font-size: 13px; color: #7f8c8d; margin-top: 20px; background: #f0f3f4; padding: 10px; border-radius: 4px; }
        .checkbox-container { display: flex; align-items: flex-start; margin-top: 10px; }
        .checkbox-container input { width: auto; margin-right: 10px; margin-top: 3px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Casa Manzoni 32</h1>
    <div class="subtitle">Modulo di Check-in Online</div>

    <form id="checkinForm">
        <label for="camera">In quale camera soggiornerai? *</label>
        <select id="camera" name="camera" required>
            <option value="">Scegli la tua camera...</option>
            <option value="Camera 1">Camera 1</option>
            <option value="Camera 2">Camera 2</option>
            <option value="Camera 3">Camera 3</option>
            <option value="Camera 4">Camera 4</option>
            <option value="Camera 5">Camera 5</option>
            <option value="Camera 6">Camera 6</option>
        </select>

        <label for="checkin">Data di arrivo (check-in) *</label>
        <input type="date" id="checkin" name="checkin" required>

        <label for="checkout">Data di partenza (check-out) *</label>
        <input type="date" id="checkout" name="checkout" required>

        <label for="referente">Nome e Cognome del referente *</label>
        <input type="text" id="referente" name="referente" placeholder="Es. Mario Rossi" required>

        <label for="telefono">Telefono cellulare *</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Es. +39 333 1234567" required>

        <label for="num_ospiti">Quante persone alloggeranno in totale? *</label>
        <select id="num_ospiti" required onchange="generaCampiOspiti()">
            <option value="1">1 Persona</option>
            <option value="2">2 Persone</option>
            <option value="3">3 Persone</option>
            <option value="4">4 Persone</option>
        </select>

        <div id="containerOspiti"></div>

        <div class="privacy">
            <strong>Informativa Privacy:</strong> I dati raccolti sono trattati esclusivamente per gli obblighi di comunicazione alle autorità di pubblica sicurezza (Alloggiati Web).
        </div>
        
        <div class="checkbox-container">
            <input type="checkbox" id="privacy_check" required>
            <label for="privacy_check" style="margin:0; font-size:14px; font-weight:normal;">Ho letto e acconsento al trattamento dei dati. *</label>
        </div>

        <button type="submit" id="btnInvia">Invia Check-in Online</button>
    </form>
</div>

<script>
    function generaCampiOspiti() {
        const num = document.getElementById('num_ospiti').value;
        const container = document.getElementById('containerOspiti');
        container.innerHTML = '';

        for (let i = 1; i <= num; i++) {
            const div = document.createElement('div');
            div.className = 'ospite-box';
            div.innerHTML = `
                <h3>Dati Ospite ${i}</h3>
                <label>Nome e Cognome *</label>
                <input type="text" class="nome_ospite" placeholder="Nome completo" required>
                <label>Numero Documento *</label>
                <input type="text" class="doc_ospite" placeholder="Es. CA00000AA" required>
            `;
            container.appendChild(div);
        }
    }

    // Avvia la prima generazione
    generaCampiOspiti();

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnInvia');
        btn.innerText = "Invio in corso...";
        btn.disabled = true;

        // Estrae i dati dagli ospiti dinamici
        const nomi = document.querySelectorAll('.nome_ospite');
        const documenti = document.querySelectorAll('.doc_ospite');
        let ospitiTesto = "";
        nomi.forEach((el, index) => {
            ospitiTesto += `[Ospite ${index+1}: ${el.value} - Doc: ${documenti[index].value}] `;
        });

        // Crea il payload dei dati pulito
        const datiPayload = {
            camera: document.getElementById('camera').value,
            checkin: document.getElementById('checkin').value,
            checkout: document.getElementById('checkout').value,
            referente: document.getElementById('referente').value,
            telefono: document.getElementById('telefono').value,
            ospiti_dati: ospitiTesto
        };

        // Incolla qui l'URL aggiornato del tuo deployment di Google Apps Script
        const urlScript = 'https://google.com';

        fetch(urlScript, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(datiPayload)
        })
        .then(response => response.json())
        .then(res => {
            if(res.status === "success") {
                alert('Grazie! Il tuo check-in è stato registrato correttamente ed è stata inviata una notifica via email.');
                document.getElementById('checkinForm').reset();
                generaCampiOspiti();
            } else {
                alert('Errore dal server: ' + res.message);
            }
        })
        .catch(error => {
            alert('Si è verificato un errore di connessione. Riprova.');
            console.error(error);
        })
        .finally(() => {
            btn.innerText = "Invia Check-in Online";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
