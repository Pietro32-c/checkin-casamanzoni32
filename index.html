<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqm0qZ41B1UDqlWm3TNtNOwLOeneXe4NhxzCQEmdD0x55kxRv5Aw1aQzvb6TDzsA/exec";

    // Funzione di utilità per convertire un file in Base64
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) resolve({ base64: "", type: "", name: "" });
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                const base64String = reader.result.split(',')[1];
                resolve({
                    base64: base64String,
                    type: file.type,
                    name: file.name
                });
            };
            reader.onerror = error => reject(error);
        });
    }

    // Funzione per aggiornare l'anteprima dell'immagine
    function updateThumbnail(file, prompt, thumb, nameEl) {
        if (!file) return;
        nameEl.textContent = file.name;

        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                thumb.src = reader.result;
                thumb.style.display = 'block';
                prompt.style.display = 'none';
            };
        } else {
            thumb.style.display = 'none';
            prompt.style.display = 'block';
        }
    }

    // Configurazione dei listener per i box di Drag and Drop
    function setupDragAndDrop(zoneId, inputId, thumbId, nameId) {
        const dropZone = document.getElementById(zoneId);
        const input = document.getElementById(inputId);
        const thumb = document.getElementById(thumbId);
        const nameEl = document.getElementById(nameId);
        const prompt = dropZone.querySelector('.drop-zone__prompt');

        if (!dropZone || !input) return;

        dropZone.addEventListener('click', (e) => {
            if (e.target !== input) input.click();
        });

        input.addEventListener('change', () => {
            if (input.files.length > 0) {
                updateThumbnail(input.files[0], prompt, thumb, nameEl);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drop-zone--over');
        });

        ['dragleave', 'dragend'].forEach(type => {
            dropZone.addEventListener(type, () => dropZone.classList.remove('drop-zone--over'));
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone--over');
            if (e.dataTransfer.files.length > 0) {
                input.files = e.dataTransfer.files;
                updateThumbnail(input.files[0], prompt, thumb, nameEl);
            }
        });
    }

    // Genera i blocchi per tutti gli ospiti (incluso il caricamento foto per ognuno)
    function generaCampiOspiti() {
        const num = parseInt(document.getElementById('num_ospiti').value, 10);
        const container = document.getElementById('containerOspiti');
        container.innerHTML = '';

        for (let i = 1; i <= num; i++) {
            const div = document.createElement('div');
            div.className = 'ospite-box';
            div.innerHTML = `
                <h3>Dati Ospite ${i}</h3>
                <label>Nome e Cognome *</label>
                <input type="text" class="nome_ospite" placeholder="Nome completo" required>
                
                <label>Numero Documento *</label>
                <input type="text" class="doc_ospite" placeholder="Es. CA00000AA" required>

                <div class="file-section" style="margin-top: 15px; background: #fff;">
                    <h4>Foto Documento Ospite ${i}</h4>
                    <label>Foto Fronte *</label>
                    <div class="drop-zone" id="dz_fronte_${i}">
                        <span class="drop-zone__prompt">Trascina qui o <strong>fai clic per scattare/scegliere la foto</strong></span>
                        <input type="file" id="foto_fronte_${i}" class="file_fronte_ospite" accept="image/*" required>
                        <div class="file-name" id="name_fronte_${i}"></div>
                        <img class="drop-zone__thumb" id="thumb_fronte_${i}">
                    </div>
                    
                    <label>Foto Retro *</label>
                    <div class="drop-zone" id="dz_retro_${i}">
                        <span class="drop-zone__prompt">Trascina qui o <strong>fai clic per scattare/scegliere la foto</strong></span>
                        <input type="file" id="foto_retro_${i}" class="file_retro_ospite" accept="image/*" required>
                        <div class="file-name" id="name_retro_${i}"></div>
                        <img class="drop-zone__thumb" id="thumb_retro_${i}">
                    </div>
                </div>
            `;
            container.appendChild(div);

            // Inizializza i drag and drop appena creati per l'ospite corrente
            setupDragAndDrop(`dz_fronte_${i}`, `foto_fronte_${i}`, `thumb_fronte_${i}`, `name_fronte_${i}`);
            setupDragAndDrop(`dz_retro_${i}`, `foto_retro_${i}`, `thumb_retro_${i}`, `name_retro_${i}`);
        }
    }

    // Esegui la prima generazione al caricamento della pagina
    generaCampiOspiti();

    // Rimuoviamo la vecchia sezione "Foto Documento Referente" se non più necessaria, 
    // dato che ora il caricamento è incorporato dinamicamente per ciascun ospite.

    // Gestione dell'invio del modulo
    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnInvia');
        btn.disabled = true;
        btn.textContent = 'Invio in corso (conversione immagini)...';

        try {
            // Struttura base dei dati generali della prenotazione
            const payload = {
                camera: document.getElementById('camera').value,
                checkin: document.getElementById('checkin').value,
                checkout: document.getElementById('checkout').value,
                referente: document.getElementById('referente').value,
                telefono: document.getElementById('telefono').value,
                num_ospiti: document.getElementById('num_ospiti').value,
                ospiti: []
            };

            // Raccoglie i dati e i file di ciascun ospite convertendoli in Base64 asincronamente
            const nodiNomi = document.querySelectorAll('.nome_ospite');
            const nodiDoc = document.querySelectorAll('.doc_ospite');
            const nodiFileFronte = document.querySelectorAll('.file_fronte_ospite');
            const nodiFileRetro = document.querySelectorAll('.file_retro_ospite');

            for (let i = 0; i < nodiNomi.length; i++) {
                const fileFronte = nodiFileFronte[i].files[0];
                const fileRetro = nodiFileRetro[i].files[0];

                // Attende la conversione in stringa leggibile da Google Apps Script
                const datiFronte = await fileToBase64(fileFronte);
                const datiRetro = await fileToBase64(fileRetro);

                payload.ospiti.push({
                    nome: nodiNomi[i].value,
                    documento: nodiDoc[i].value,
                    foto_fronte: datiFronte,
                    foto_retro: datiRetro
                });
            }

            btn.textContent = 'Trasmissione dati a Google Fogli...';

            // Invio tramite richiesta POST in formato JSON puro
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                redirect: "follow", // Fondamentale per gestire i reindirizzamenti di Google Macro
                method: 'POST',
                body: JSON.stringify(payload)
            });

            const risultato = await response.json();

            if (risultato.status === 'success' || response.ok) {
                alert('Check-in registrato con successo! Grazie.');
                document.getElementById('checkinForm').reset();
                generaCampiOspiti();
            } else {
                throw new Error(risultato.message || 'Errore durante il salvataggio dei dati.');
            }

        } catch (error) {
            console.error('Errore dettagliato:', error);
            alert('Si è verificato un errore durante l\'invio. Verifica che la Web App di Google sia configurata per ricevere JSON.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Invia Check-in Online';
        }
    });
</script>
